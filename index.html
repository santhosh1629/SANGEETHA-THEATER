
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8B5CF6" />
    <meta
      name="description"
      content="SANGEETHA THEATER - Your movie snack destination."
    />
    <title>SANGEETHA THEATER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Polyfill for Supabase and other libs expecting process.env
      window.process = { env: { NODE_ENV: 'production' } };

      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'Inter', 'sans-serif'],
              heading: ['Fredoka', 'Montserrat', 'sans-serif'],
            },
            colors: {
              primary: '#FF0033', // Red Neon
              'primary-dark': '#CC0029',
              accent: '#9400D3', // Dark Violet
              'accent-dark': '#7B00B0',
              background: '#1d002f', // Dark Violet base
              surface: '#2B0042', // Slightly lighter violet for cards
              'surface-light': '#3D005C',
              textPrimary: '#F8FAFC',
              textSecondary: '#CBD5E0',
            },
            backgroundImage: {
              'home-violet-gradient': 'linear-gradient(140deg, #1d002f 0%, #2B0042 60%, #9400D3 100%)',
              'energetic-gradient': 'linear-gradient(160deg, #1d002f 0%, #FF0033 70%, #2B0042 100%)',
              'toast-cart-add': 'linear-gradient(135deg, #FF0033, #9400D3)',
              'toast-payment-success': 'linear-gradient(135deg, rgba(34, 197, 94, 0.6), rgba(34, 197, 94, 0.5))',
            },
            keyframes: {
              'sparkle': {
                '0%, 100%': { transform: 'scale(1)', opacity: 1, textShadow: '0 0 5px #fff, 0 0 10px #FF0033, 0 0 15px #FF0033' },
                '50%': { transform: 'scale(1.2)', opacity: 0.8, textShadow: '0 0 10px #fff, 0 0 20px #FF0033, 0 0 30px #FF0033' },
              },
              'neon-glow': {
                '0%, 100%': { filter: 'drop-shadow(0 0 4px #FF0033) drop-shadow(0 0 8px #FF0033)' },
                '50%': { filter: 'drop-shadow(0 0 8px #FF1A4A) drop-shadow(0 0 16px #FF1A4A)' },
              },
              'fade-in-down': {
                '0%': { opacity: '0', transform: 'translateY(-10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'fade-in-up': {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'fade-in-right': {
                '0%': { opacity: '0', transform: 'translateX(10px)' },
                '100%': { opacity: '1', transform: 'translateX(0)' },
              },
              'pop-in': {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              'scale-in': {
                '0%': { opacity: '0', transform: 'scale(0.8)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              'draw-check': {
                'to': { strokeDashoffset: '0' }
              },
              'float': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-5px)' }
              },
              'cart-bounce': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-5px)' }
              },
              'shake': {
                '0%, 100%': { transform: 'rotate(0deg)' },
                '25%': { transform: 'rotate(-5deg)' },
                '75%': { transform: 'rotate(5deg)' }
              },
              'toast': {
                '0%': { transform: 'translateY(-20px)', opacity: '0' },
                '8%': { transform: 'translateY(0)', opacity: '1' },
                '92%': { transform: 'translateY(0)', opacity: '1' },
                '100%': { transform: 'translateY(-20px)', opacity: '0' }
              }
            },
            animation: {
              'sparkle': 'sparkle 1s ease-in-out infinite',
              'neon-glow': 'neon-glow 2s ease-in-out infinite alternate',
              'fade-in-down': 'fade-in-down 0.2s ease-out forwards',
              'fade-in-up': 'fade-in-up 0.2s ease-out forwards',
              'fade-in-right': 'fade-in-right 0.2s ease-out forwards',
              'slide-in-up': 'fade-in-up 0.2s ease-out forwards',
              'pop-in': 'pop-in 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'scale-in': 'scale-in 0.2s ease-out forwards',
              'draw-check': 'draw-check 0.3s ease-in-out forwards',
              'float': 'float 2s ease-in-out infinite',
              'cart-bounce': 'cart-bounce 0.2s ease-in-out',
              'shake': 'shake 0.2s ease-in-out infinite',
              'toast': 'toast 4s ease-in-out forwards'
            }
          }
        }
      }
    </script>
    <style>
      .scrollbar-thin {
        scrollbar-width: thin;
        scrollbar-color: #FF0033 #1d002f;
      }
      .scrollbar-thin::-webkit-scrollbar {
        height: 6px;
        width: 6px;
      }
      .scrollbar-thin::-webkit-scrollbar-track {
        background: #1d002f;
        border-radius: 3px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background-color: #FF0033;
        border-radius: 3px;
      }
      .btn-3d {
        position: relative;
        transition: transform 0.05s ease-out, box-shadow 0.05s ease-out;
        border-bottom-width: 4px;
        box-shadow: 0 0 10px rgba(255, 0, 51, 0.4);
      }
      .btn-3d:active {
        transform: translateY(2px);
        border-bottom-width: 2px;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.1.1/",

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.1",
    "recharts": "https://aistudiocdn.com/recharts@^3.2.1",
    "qrcode.react": "https://aistudiocdn.com/qrcode.react@^4.2.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^11.3.19",
    "typewriter-effect": "https://aistudiocdn.com/typewriter-effect@^2.21.0",
    "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
  }
}
</script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

</html>
